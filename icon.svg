<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CyberCompass">
  <rect width="64" height="64" rx="13" fill="#0a0d10"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#ff7a1a" stroke-width="2.5"/>
  <!-- north needle (brand orange) -->
  <path d="M32 11 L39 32 L32 32 Z" fill="#ff7a1a"/>
  <path d="M32 11 L25 32 L32 32 Z" fill="#ff7a1a" opacity="0.55"/>
  <!-- south needle (muted) -->
  <path d="M32 53 L39 32 L32 32 Z" fill="#8d97a2" opacity="0.55"/>
  <path d="M32 53 L25 32 L32 32 Z" fill="#8d97a2" opacity="0.35"/>
  <!-- hub -->
  <circle cx="32" cy="32" r="2.8" fill="#0a0d10" stroke="#ff7a1a" stroke-width="1.6"/>
  <!-- north tick -->
  <line x1="32" y1="7.5" x2="32" y2="12" stroke="#ff7a1a" stroke-width="2.4"/>
</svg>

# ============================================================
# CyberCompass — Windows release build
# ------------------------------------------------------------
# Runs automatically whenever you push a version tag, e.g.:
#
#     git tag v0.2.0
#     git push origin v0.2.0
#
# It builds the Windows installer (CyberCompass-Setup.exe) and
# the portable exe and attaches both to a GitHub Release for that
# tag (electron-builder creates it as a draft — publish it from
# the Releases tab to make it the latest download). Uses the
# built-in GITHUB_TOKEN; no secrets to configure.
#
# NOTE: builds are UNSIGNED. Publishing is a manual step (the
# draft) so unsigned installers are never auto-released without a
# human action.
# ============================================================

name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # also allows manual runs from the Actions tab

permissions:
  contents: write         # needed to create the GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Assemble www/
        run: npm run make-www

      - name: Build and publish Windows exe
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ============================================================
# "No embedded AI" guard
# ------------------------------------------------------------
# CyberCompass's core promise (README / page footer) is that it
# contains no AI/ML code, no embedded copilot/chatbot, and no
# calls to an AI-provider API. This workflow fails the build if
# a future commit accidentally introduces one — a dependency, an
# AI-assistant reference, or a call to a known AI-provider API.
#
# A lightweight guardrail, not a legal certification — it catches
# obvious slips, not disguised code. Docs (README) are allowed to
# *talk about* AI (the page covers AI-enabled devices), so only
# the files that actually ship/run are scanned.
# ============================================================

name: No embedded AI check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan shipped app/build source for AI-provider or AI-assistant references
        run: |
          set -e
          # index.html carries the inline app JS/CSS, so it is scanned too.
          TARGETS="index.html sw.js electron/main.js scripts/make-www.js package.json manifest.webmanifest"
          PATTERN='openai\.com|anthropic\.com|api\.anthropic|copilot|chatgpt|claude-[a-z0-9-]*\.(js|json)|@anthropic-ai|@openai|langchain|tensorflow|onnxruntime|huggingface'
          HIT=0
          for f in $TARGETS; do
            if [ -f "$f" ] && grep -EinH "$PATTERN" "$f"; then
              HIT=1
            fi
          done
          if [ "$HIT" -eq 1 ]; then
            echo "::error::Found a reference to an AI provider/assistant/ML library in shipped app or build code. CyberCompass must stay AI-free in its runtime and toolchain."
            exit 1
          fi
          echo "Clean — no embedded AI/ML references found in shipped code."

      - name: Check no AI/ML runtime dependencies were added
        run: |
          set -e
          if [ -f package.json ]; then
            if grep -Ei '"(openai|@anthropic-ai/[a-z-]*|langchain|@tensorflow/[a-z-]*|onnxruntime-node|@huggingface/[a-z-]*)"[[:space:]]*:' package.json; then
              echo "::error::An AI/ML package is listed as a dependency in package.json. CyberCompass ships no AI/ML runtime dependencies."
              exit 1
            fi
          fi
          echo "package.json has no AI/ML dependencies."
